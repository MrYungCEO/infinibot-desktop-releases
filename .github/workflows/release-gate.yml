# Release gate for InfiniBot Desktop. Source of truth:
#   InfiniBot scripts/desktop/release-gate/release-gate.yml (synced to the PUBLIC
#   releases repo by scripts/desktop/release-gate/sync-to-releases-repo.sh).
#
# Installs the packaged installers from a (draft) GitHub release on REAL
# windows-latest and ubuntu-latest runners with NO Node on PATH, then drives the
# app with Playwright's Electron support through the whole new-user onboarding.
# Only when both platforms pass does the `verdict` job upload
#   release-gate-pass-<exe sha[0:16]>-<AppImage sha[0:16]>
# which scripts/desktop/publish-github-release.sh requires before it publishes.
name: release-gate
run-name: "release gate ${{ inputs.tag }}${{ inputs.label && format(' — {0}', inputs.label) || '' }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the installers (draft OK), e.g. v2026.10.19"
        required: true
      label:
        description: "Free text shown in the run name (e.g. candidate 3f2a1b)"
        required: false
        default: ""
      expected_exe_sha256:
        description: "Optional: fail unless the downloaded exe has this sha256"
        required: false
        default: ""
      expected_appimage_sha256:
        description: "Optional: fail unless the downloaded AppImage has this sha256"
        required: false
        default: ""

# Drafts are only visible to tokens with push access.
permissions:
  contents: write
  actions: read

concurrency:
  group: release-gate-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PLAYWRIGHT_VERSION: "1.64.1"
  # Optional real-key provider tests. Unset secrets → those checks are skipped.
  IB_GATE_OLLAMA_CLOUD_KEY: ${{ secrets.IB_GATE_OLLAMA_CLOUD_KEY }}
  IB_GATE_OPENAI_KEY: ${{ secrets.IB_GATE_OPENAI_KEY }}
  IB_GATE_ANTHROPIC_KEY: ${{ secrets.IB_GATE_ANTHROPIC_KEY }}
  IB_GATE_OPENROUTER_KEY: ${{ secrets.IB_GATE_OPENROUTER_KEY }}

jobs:
  windows:
    # A real consumer Windows PC, not the runner image: no Node, no Docker,
    # minimal PATH, and the VC++ runtime either stale (14.29, very common on
    # home PCs: 2026.10.18's native voice died with "DLL initialization routine
    # failed") or missing. The runner image's current runtime hid that bug.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vcruntime: old-14.29, node: none }
          - { vcruntime: missing, node: none }
          # A user who already has Node.js: npm.cmd on PATH. 2026.10.18 spawned
          # it without a shell → EINVAL → "npm install failed (exit -1)".
          - { vcruntime: current, node: installed }
    name: windows (vcruntime ${{ matrix.vcruntime }}, node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 110
    outputs:
      sha256: ${{ steps.dl.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: gate }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download installer
        id: dl
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p InfiniBot-Setup-x64.exe -D "$env:RUNNER_TEMP\dl"
          $sha = (Get-FileHash "$env:RUNNER_TEMP\dl\InfiniBot-Setup-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "exe sha256 $sha"
          if ("${{ inputs.expected_exe_sha256 }}" -and "${{ inputs.expected_exe_sha256 }}" -ne $sha) { throw "exe sha256 mismatch" }
      - name: Install Playwright (gate runner only)
        working-directory: gate
        run: npm install --no-audit --no-fund "@playwright/test@$env:PLAYWRIGHT_VERSION"
      - name: Consumer PC PATH (node ${{ matrix.node }}, no Docker; private node for Playwright)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\gate-node" | Out-Null
          Copy-Item (Get-Command node).Source "$env:RUNNER_TEMP\gate-node\node.exe"
          $hide = @("$env:RUNNER_TOOL_CACHE\node", "C:\npm\prefix")
          if ('${{ matrix.node }}' -eq 'none') { $hide += @("C:\Program Files\nodejs", "$env:APPDATA\npm") }
          foreach ($d in $hide) {
            if (Test-Path $d) { Rename-Item $d -NewName ((Split-Path $d -Leaf) + ".gate-hidden"); "hid $d" }
          }
          # Docker too: a new user's machine has none (runner images ship it).
          foreach ($svc in @('docker','com.docker.service')) { Stop-Service $svc -Force -ErrorAction SilentlyContinue }
          foreach ($f in @("$env:WINDIR\System32\docker.exe", "$env:WINDIR\System32\dockerd.exe", "C:\Program Files\Docker\docker.exe", "C:\Program Files\Docker\dockerd.exe")) {
            if (Test-Path $f) { takeown /f $f /a | Out-Null; icacls $f /grant "*S-1-5-32-544:F" | Out-Null; Rename-Item $f ((Split-Path $f -Leaf) + ".gate-hidden"); "hid $f" }
          }
          # PATH of a fresh Windows 11 user, nothing from the runner image.
          $parts = @("$env:WINDIR\system32", "$env:WINDIR", "$env:WINDIR\System32\Wbem", "$env:WINDIR\System32\WindowsPowerShell\v1.0\", "$env:WINDIR\System32\OpenSSH\", "$env:LOCALAPPDATA\Microsoft\WindowsApps")
          # Node.js installer adds exactly these two.
          if ('${{ matrix.node }}' -eq 'installed') { $parts += @("C:\Program Files\nodejs\", "$env:APPDATA\npm") }
          $clean = $parts -join ';'
          "IB_GATE_CLEAN_PATH=$clean" >> $env:GITHUB_ENV
          $env:PATH = $clean
          $absent = @('docker'); if ('${{ matrix.node }}' -eq 'none') { $absent += @('node','npm','npx') }
          foreach ($c in $absent) { if (Get-Command $c -ErrorAction SilentlyContinue) { throw "$c still on PATH: $((Get-Command $c).Source)" } }
          if ('${{ matrix.node }}' -eq 'installed') { "node on PATH (as a Node.js user): $((Get-Command node).Source) $(& node --version)"; "npm: $((Get-Command npm).Source)" }
          "absent from PATH: $($absent -join ', ')"
      - name: VC++ runtime like a consumer PC (${{ matrix.vcruntime }})
        run: |
          $sys = "$env:WINDIR\System32"
          $dlls = 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll','vccorlib140.dll','vcomp140.dll'
          "before: msvcp140 $((Get-Item "$sys\msvcp140.dll").VersionInfo.FileVersion)"
          if ('${{ matrix.vcruntime }}' -eq 'current') { "keeping the runner's VC++ runtime"; return }
          if ('${{ matrix.vcruntime }}' -eq 'old-14.29') {
            python -m pip download msvc-runtime==14.29.30133 --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.10 -d "$env:RUNNER_TEMP\vc" -q
            $whl = Get-ChildItem "$env:RUNNER_TEMP\vc\*.whl" | Select-Object -First 1
            Copy-Item $whl.FullName "$env:RUNNER_TEMP\vc\w.zip"; Expand-Archive "$env:RUNNER_TEMP\vc\w.zip" "$env:RUNNER_TEMP\vc\x" -Force
          }
          foreach ($d in $dlls) {
            $p = Join-Path $sys $d
            if (Test-Path $p) {
              takeown /f $p /a | Out-Null; icacls $p /grant "*S-1-5-32-544:F" | Out-Null
              Rename-Item $p "$d.gate-hidden"
            }
            if ('${{ matrix.vcruntime }}' -eq 'old-14.29') {
              $old = Get-ChildItem "$env:RUNNER_TEMP\vc\x" -Recurse -Filter $d | Select-Object -First 1
              if ($old) { Copy-Item $old.FullName $p }
            }
          }
          if (Test-Path "$sys\msvcp140.dll") { "after: msvcp140 $((Get-Item "$sys\msvcp140.dll").VersionInfo.FileVersion)" } else { "after: no msvcp140.dll in System32" }
          if ('${{ matrix.vcruntime }}' -eq 'old-14.29' -and -not ((Get-Item "$sys\msvcp140.dll").VersionInfo.FileVersion -like '14.29*')) { throw "old runtime not in place" }
      - name: Silent install (NSIS /S)
        timeout-minutes: 20
        run: |
          # WaitForExit on the installer process only: Start-Process -Wait also
          # waits for every descendant.
          $t0 = Get-Date
          $p = Start-Process "$env:RUNNER_TEMP\dl\InfiniBot-Setup-x64.exe" -ArgumentList '/S','/D=C:\IBGate\InfiniBot' -PassThru
          if (-not $p.WaitForExit(900000)) { Get-Process | Sort-Object StartTime -ErrorAction SilentlyContinue | Select-Object -Last 15 Name,Id,StartTime | Format-Table | Out-String; throw "installer still running after 15 min" }
          "installer exit $($p.ExitCode) in $([int]((Get-Date) - $t0).TotalSeconds) s"
          Get-Process | Where-Object { $_.Name -match 'InfiniBot|Setup' } | Format-Table Name,Id | Out-String
          if (-not (Test-Path 'C:\IBGate\InfiniBot\InfiniBot.exe')) { Get-ChildItem C:\IBGate -Recurse -Depth 1; throw "InfiniBot.exe not installed" }
      - name: End-to-end onboarding
        timeout-minutes: 80
        working-directory: gate
        env:
          IB_GATE_APP: C:\IBGate\InfiniBot\InfiniBot.exe
          IB_GATE_PLATFORM: windows
          IB_GATE_VARIANT: vcruntime-${{ matrix.vcruntime }} node-${{ matrix.node }}
          IB_GATE_EXPECT_VERSION: ${{ inputs.tag }}
        run: |
          $env:PATH = $env:IB_GATE_CLEAN_PATH
          & "$env:RUNNER_TEMP\gate-node\node.exe" node_modules/@playwright/test/cli.js test
      - name: Summary
        if: always()
        working-directory: gate
        run: if (Test-Path out/summary.md) { Get-Content out/summary.md >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-windows-vc-${{ matrix.vcruntime }}-node-${{ matrix.node }}
          path: gate/out
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      sha256: ${{ steps.dl.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: gate }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download AppImage
        id: dl
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p InfiniBot-x86_64.AppImage -D "$RUNNER_TEMP/dl"
          chmod +x "$RUNNER_TEMP/dl/InfiniBot-x86_64.AppImage"
          sha=$(sha256sum "$RUNNER_TEMP/dl/InfiniBot-x86_64.AppImage" | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"; echo "AppImage sha256 $sha"
          if [ -n "${{ inputs.expected_appimage_sha256 }}" ] && [ "${{ inputs.expected_appimage_sha256 }}" != "$sha" ]; then echo "sha mismatch"; exit 1; fi
      - name: Install Playwright (gate runner only) + xvfb
        working-directory: gate
        run: |
          npm install --no-audit --no-fund "@playwright/test@$PLAYWRIGHT_VERSION"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - name: Make the machine Node- and Docker-free (keep a private node for Playwright)
        run: |
          mkdir -p "$RUNNER_TEMP/gate-node" && cp "$(command -v node)" "$RUNNER_TEMP/gate-node/node"
          for f in /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack /usr/bin/node /usr/bin/npm /usr/bin/npx; do
            if [ -e "$f" ]; then sudo mv "$f" "$f.gate-hidden"; echo "hid $f"; fi
          done
          if [ -d "$RUNNER_TOOL_CACHE/node" ]; then sudo mv "$RUNNER_TOOL_CACHE/node" "$RUNNER_TOOL_CACHE/node.gate-hidden"; echo "hid toolcache node"; fi
          # Docker too: a new user's machine has none (runner images ship it).
          sudo systemctl stop docker.socket docker containerd 2>/dev/null || true
          for f in /usr/bin/docker /usr/local/bin/docker /usr/bin/docker-compose /usr/local/bin/docker-compose /usr/bin/podman; do
            if [ -e "$f" ]; then sudo mv "$f" "$f.gate-hidden"; echo "hid $f"; fi
          done
          clean=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          echo "IB_GATE_CLEAN_PATH=$clean" >> "$GITHUB_ENV"
          for c in node npm npx docker; do if PATH="$clean" command -v $c; then echo "$c still on PATH"; exit 1; fi; done
          echo "no node/npm/npx/docker on PATH"
      - name: End-to-end onboarding
        timeout-minutes: 80
        working-directory: gate
        env:
          IB_GATE_APP: ${{ runner.temp }}/dl/InfiniBot-x86_64.AppImage
          IB_GATE_PLATFORM: linux
          IB_GATE_EXPECT_VERSION: ${{ inputs.tag }}
        run: PATH="$IB_GATE_CLEAN_PATH" xvfb-run -a -s "-screen 0 1440x900x24" "$RUNNER_TEMP/gate-node/node" node_modules/@playwright/test/cli.js test
      - name: Summary
        if: always()
        working-directory: gate
        run: '[ -f out/summary.md ] && cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-linux
          path: gate/out
          if-no-files-found: warn

  verdict:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Write verdict
        run: |
          EXE=${{ needs.windows.outputs.sha256 }}; APP=${{ needs.linux.outputs.sha256 }}
          mkdir -p v
          cat > v/verdict.json <<EOF
          {
            "result": "pass",
            "tag": "${{ inputs.tag }}",
            "exe_sha256": "$EXE",
            "appimage_sha256": "$APP",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "workflow_sha": "${{ github.sha }}"
          }
          EOF
          cat v/verdict.json
          echo "NAME=release-gate-pass-${EXE:0:16}-${APP:0:16}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: v/verdict.json
          retention-days: 90
